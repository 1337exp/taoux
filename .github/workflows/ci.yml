name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npm run sandbox:build
            # install the packed tarball into a throwaway app next to TaoUI and build it
            - run: npm run smoke
